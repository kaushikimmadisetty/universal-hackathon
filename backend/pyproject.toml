[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-hackathon-backend"
version = "0.1.0"
description = "FastAPI control plane for the Universal Hackathon product launch demo."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pymongo[srv]>=4.11,<5",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
